# Production : site + PostgreSQL + Caddy (HTTPS automatique) + sauvegardes quotidiennes
# Usage : docker compose -f docker-compose.prod.yml up -d --build   (voir docs/DEPLOIEMENT.md)
name: tsd-site-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-tsd_site}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Aucun port publié : la base n'est joignable que par les autres services

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tsd}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsd_site}
      UPLOAD_DIR: /app/uploads
      SITE_URL: ${SITE_URL:-https://tsdsystems.net}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-tsdsystems.net}
      ACME_EMAIL: ${ACME_EMAIL:-contact@tsdsystems.net}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    build: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-tsd}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tsd_site}
      UPLOAD_DIR: /uploads
      BACKUP_DIR: /backups
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_LOCAL_DAYS: ${BACKUP_KEEP_LOCAL_DAYS:-7}
      BACKUP_KEEP_REMOTE_DAYS: ${BACKUP_KEEP_REMOTE_DAYS:-30}
      RCLONE_CONFIG: /config/rclone.conf
      TZ: ${TZ:-UTC}
    volumes:
      - uploads:/uploads
      - backups:/backups
      - ./rclone.conf:/config/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy

  # Outils ponctuels (migrations, seed) : non démarré par « up »
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tsd}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsd_site}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
